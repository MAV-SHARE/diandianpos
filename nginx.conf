server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        text/html;

    # Tighten file modes
    autoindex off;

    # Cache HTML + CSS modestly (diandianpos is informational, no PWA)
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # SVG favicon / icon
    location ~* \.svg$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Privacy page: pretty URL with trailing slash
    # 透過 Cloudflare Tunnel 會帶 X-Forwarded-Proto，沿用原 scheme 避免 downgrade flash
    location = /privacy {
        return 301 $http_x_forwarded_proto://$host/privacy/;
    }

    location /privacy/ {
        try_files $uri $uri/ /privacy/index.html =404;
    }

    # Default: serve file, fall back to dist's index.html
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Hide nginx version on errors
    server_tokens off;
}
